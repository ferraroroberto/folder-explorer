  - id: doc.sheet
    area: doc
    title: Document sheet
    root: data-surface
    reach:
      - View or Edit here from the Search preview or an Explore row menu
      - a tap on a Markdown or HTML row on a touch screen, or a double-click
      - a dropped file inside the app
    holds:
      - a header with Back, the file's name, an outline button, Save (in Edit), Open in new window and ×
      - a View / Edit switch and the file's place
      - the document, or the editor
    does:
      - a relative link to another scanned document opens in the same sheet, and Back returns
      - an HTML page draws in a frame sandboxed without allow-same-origin
      - Esc in Edit goes back to View; closing with unsaved changes asks first
    states:
      - "a dropped file the scan does not have is shown read-only with a note, or with Edit and a note that Save writes it back to the file when the browser gave its handle; it has no Open in new window"
      - "Save on such a file asks the browser for write permission (once per file), and a refusal keeps the draft"
      - a state block when it cannot show (see doc.state)
    why: the sheet never sends a path; every document is named by root, scan id and item id
    links:
      - to: doc.outline
        via: outline button
      - to: doc.editor
        via: Edit
      - to: doc.state
        via: a refusal
      - to: doc.confirm
        via: closing with unsaved changes
      - to: doc.window
        via: Open in new window

  - id: doc.outline
    area: doc
    title: Outline popover
    root: data-surface
    reach:
      - the outline button in the document sheet's header, when the document has headings
    holds:
      - the document's headings as in-page links, indented by level
    does:
      - a heading scrolls the document to it and closes the popover
    states:
      - "*No headings*"

  - id: doc.state
    area: doc
    title: Why a document can't show
    root:
      none: a block drawn inside the document sheet or window in place of the document
    reach:
      - the file is cloud-only, too large, moved, gone, not a Markdown or HTML file, not UTF-8, unreadable, the scan was renumbered, or the connection is down
    holds:
      - the refusal's sentence and a line saying what to do
      - one action where one helps (Download and open, Open Explore or Reload)
    does:
      - "Download and open is the one tap that brings a cloud-only file to the PC"
    why: a cloud-only file is never opened without that tap, so nothing hydrates by accident
    links:
      - to: explore.tab
        via: Open Explore

  - id: doc.editor
    area: doc
    title: Document editor
    root: data-surface
    reach:
      - Edit in the document sheet or window, or Edit here
    holds:
      - a Write / Preview switch (a narrow window), a formatting toolbar for Markdown, a status line and Discard
      - the source, with a live preview beside it on a wide desktop
      - a row of Markdown keys above the keyboard on a phone
    does:
      - Save, or Ctrl+S, writes the file after checking it has not changed on disk
      - the draft stays on this device until it is saved or discarded
    states:
      - an HTML file is plain source with a framed preview and no Markdown tools
      - a file over 1 MB, not UTF-8 or not editable opens read-only
    links:
      - to: doc.conflict
        via: Save on a changed file
      - to: doc.confirm
        via: Discard

  - id: doc.conflict
    area: doc
    title: Changed on disk
    root: data-surface
    reach:
      - Save when the file changed on disk since the editor opened it
    holds:
      - "*Changed on disk since you opened it* and that the text is not lost"
      - Compare, Copy my text, Load theirs and Overwrite theirs…
      - a line diff of the two copies after Compare
    does:
      - Overwrite theirs… asks first and keeps the replaced copy as a backup in the app's data folder; for a dropped file saved through the browser it says the copy is not kept
    links:
      - to: doc.confirm
        via: Overwrite theirs…

  - id: doc.confirm
    area: doc
    title: Confirm sheet
    root: data-surface
    reach:
      - leaving the editor with unsaved changes (Discard, Keep draft or Save)
      - Discard in the editor (*Discard your changes?*)
      - Overwrite theirs… on the conflict screen (*Overwrite the copy on disk?*)
    holds:
      - one question, its choices and ×
    does:
      - × or a tap outside backs out and changes nothing
    why: it is built on demand and opens above an open sheet, so the sheet and the window share one copy

  - id: doc.window
    area: doc
    title: Document window
    root: data-surface
    reach:
      - Open in new window from the sheet, an Explore row menu or the Search preview
      - "`/doc?root=…&scan=…&id=…`, a bookmark or the Markdown Open with handler"
      - a dropped file opened from the app
    holds:
      - the header (the file's name, its folder, an outline button, Save, the theme toggle)
      - a View / Edit switch
      - the document or the editor, with the outline and recent documents beside it
    does:
      - the nav leads back into the app on a tab, asking first when there are unsaved changes
      - Esc in Edit goes back to View
    states:
      - "a dropped file has no address of its own: read-only with the mode switch hidden, or, when the browser gave its handle, with View / Edit and Save writing back to the file"
      - an address that names no document says so
      - the browser asks before the window closes with unsaved changes
    desktop: the outline sits beside the text from 1100px with a mouse; elsewhere it is a popover under the header
    links:
      - to: doc.nav
        via: nav
      - to: doc.side
        via: outline and recent
      - to: doc.editor
        via: Edit
      - to: doc.state
        via: a refusal
      - to: doc.confirm
        via: leaving with unsaved changes

  - id: doc.nav
    area: doc
    title: Nav in the document window
    root: data-surface
    reach:
      - the top of the document window
    holds:
      - the five tabs, none selected
    does:
      - a tab opens the app on that tab
    links:
      - to: search.tab
        via: Search
      - to: explore.tab
        via: Explore

  - id: doc.side
    area: doc
    title: Outline and recent documents
    root: data-surface
    reach:
      - the sidebar of the document window (a popover under the header on a narrow window)
    holds:
      - the outline, when the document has headings
      - Recent, the documents opened last, which the server shares across windows and devices
    does:
      - a recent document opens in this window

  - id: archive.card
    area: archive
    title: Archive card
    root: data-surface
    reach:
      - Search, Emails mode, on the PC with the Outlook archive block on
    holds:
      - an Archive the open mail row with a line saying what it archives
    does:
      - opens the Archive sheet on the mail open or selected in Outlook (classic)
    states:
      - the line names why it is not ready, in the attention tone, and the row is disabled
      - after filing it says where the last mail went
    links:
      - to: archive.sheet
        via: the row

  - id: archive.sheet
    area: archive
    title: Archive sheet
    root: data-surface
    reach:
      - the Archive card
      - the Archive button in Outlook, which hands the mail over while the page is visible
    holds:
      - the mail (subject, sender, date, attachments, a foldable preview)
      - "Already archived as … with an Archive a copy anyway switch, when it is"
      - Suggested folders, each with a score, the reasons and an Open in File Explorer button, and an info line on how they are ranked
      - a Find a folder box with its results, a step into subfolders, Archive here and Open in File Explorer
      - Current Explorer folder
      - the Outlook category, a Date prefix choice and the name it would save as
      - a footer line about the Outlook macro
      - the Archive to … button
    does:
      - filing saves the mail into the chosen folder, closes the sheet and toasts where it went
    states:
      - "*Couldn't open the mail*, with Try again unless the macro opened it"
      - "*Finding folders…* while the ranking runs, or *No folder matches this mail yet.*"
      - a folder outside the email folders cannot be filed to
      - the button says Archiving… while it works and Pick a folder with no choice
    links:
      - to: archive.macro
        via: the macro info button

  - id: archive.macro
    area: archive
    title: Outlook macro sheet
    root: data-surface
    reach:
      - Settings, Outlook macro
      - the macro info button on the Archive sheet
    holds:
      - what the Archive button in Outlook does
      - a Prefer the window over the web app switch
      - four numbered steps (set the folder, import the macro, add it to the ribbon, restart Outlook), each with its command or text in a copyable listing
    does:
      - Copy copies a listing
    states:
      - on another device the first step says to open the sheet on the PC itself

  - id: settings.sheet
    area: settings
    title: Settings page
    root: data-surface
    reach:
      - the gear in any tab's header
    holds:
      - the first-run card, when there is no config.json
      - the groups Display, Available features, Scanning, Email, Outlook archive, Files and documents, Tray and screenshot and Remote access
    does:
      - opens as the full Settings page over the tab and closes with × or Esc
    links:
      - to: settings.setup
        via: no config.json
      - to: settings.display
        via: Display
      - to: settings.features
        via: Available features
      - to: settings.scanning
        via: Scanning
      - to: settings.email
        via: Email
      - to: settings.outlook-group
        via: Outlook archive
      - to: settings.files
        via: Files and documents
      - to: settings.tray
        via: Tray and screenshot
      - to: settings.remote-group
        via: Remote access

  - id: settings.setup
    area: settings
    title: Set up folder-explorer
    root: data-surface
    reach:
      - the top of the Settings sheet while there is no config.json
    holds:
      - a note that the built-in defaults are in use
      - Create config.json
    does:
      - creates config.json from config.example.json and never overwrites an existing one

  - id: settings.display
    area: settings
    title: Display group
    root: data-surface
    holds:
      - Text size, Small, Default or Large
      - Totals by, the default basis, Size or On disk
    does:
      - each applies at once; text size is kept on this device, the basis in config.json

  - id: settings.features
    area: settings
    title: Available features group
    root: data-surface
    holds:
      - a switch each for Email, Outlook archive, Documents and Screenshot, with what each does and why one is not available here
      - a footnote on how a block that is off behaves
    does:
      - a block that is off hides its screens, stops its background work and skips its calls, with no restart

  - id: settings.scanning
    area: settings
    title: Scanning group
    root: data-surface
    holds:
      - Scan schedule, Folders to scan and Skipped folders, each showing its value and opening a sheet
      - Index on this PC, the disk space the indexes use
    links:
      - to: settings.schedule
        via: Scan schedule
      - to: settings.roots
        via: Folders to scan
      - to: settings.exclude
        via: Skipped folders

  - id: settings.email
    area: settings
    title: Email group
    root: data-surface
    reach:
      - the Settings sheet, Email block on
    holds:
      - Email folders, Left out of the index and Mail downloads, each showing its value and opening a sheet
    links:
      - to: settings.email-roots
        via: Email folders
      - to: settings.email-exclude
        via: Left out of the index
      - to: settings.budget
        via: Mail downloads

  - id: settings.outlook-group
    area: settings
    title: Outlook archive group
    root: data-surface
    reach:
      - the Settings sheet, Outlook archive block on
    holds:
      - Outlook archiving, showing Category and Move when they are on
      - Outlook macro, showing Ready or Not ready
    links:
      - to: settings.outlook
        via: Outlook archiving
      - to: archive.macro
        via: Outlook macro

  - id: settings.files
    area: settings
    title: Files and documents group
    root: data-surface
    holds:
      - Documents search and Remote content, with the Documents block on
      - Explorer window
      - Markdown files, on the PC only and with the Documents block on
    links:
      - to: settings.markdown-search
        via: Documents search
      - to: settings.remote-html
        via: Remote content
      - to: settings.explorer-window
        via: Explorer window
      - to: settings.md-assoc
        via: Markdown files

  - id: settings.tray
    area: settings
    title: Tray and screenshot group
    root: data-surface
    holds:
      - Tray click, showing Quick search or Open app
      - Screenshot, showing the hotkey, with the Screenshot block on
    links:
      - to: settings.tray-click
        via: Tray click
      - to: settings.screenshot
        via: Screenshot

  - id: settings.remote-group
    area: settings
    title: Remote access group
    root: data-surface
    holds:
      - Remote access, showing On or Off
    links:
      - to: settings.remote
        via: Remote access

  - id: settings.setting
    area: settings
    title: Setting sheet
    root: data-surface
    reach:
      - any Settings row that holds a choice
    holds:
      - the one setting's control and note (see the entries below), under its own title
    does:
      - closes with ×, Esc or a tap outside, and the Settings sheet is under it

  - id: settings.schedule
    area: settings
    title: Scan schedule
    root: data-surface
    reach:
      - Settings, Scanning, Scan schedule
    holds:
      - Schedule, Off, Every night or Every hour
      - Nightly scan time, for Every night
      - a note
    does:
      - saves as it changes

  - id: settings.roots
    area: settings
    title: Folders to scan
    root: data-surface
    reach:
      - Settings, Scanning, Folders to scan
    holds:
      - an All drives and OneDrive switch
      - the folder list, when it is off, with its add field
      - a note
    does:
      - the list adds a path and saves at once; a row's kebab removes it
    links:
      - to: settings.folder-menu
        via: a row's kebab

  - id: settings.exclude
    area: settings
    title: Skipped folders
    root: data-surface
    reach:
      - Settings, Scanning, Skipped folders
    holds:
      - the folders the disk scan, the folder search and the email index all leave out, with an add field
    links:
      - to: settings.folder-menu
        via: a row's kebab

  - id: settings.email-roots
    area: settings
    title: Email folders
    root: data-surface
    reach:
      - Settings, Email, Email folders
    holds:
      - the folders whose .msg files the email index reads, with an add field
    links:
      - to: settings.folder-menu
        via: a row's kebab

  - id: settings.email-exclude
    area: settings
    title: Left out of the email index
    root: data-surface
    reach:
      - Settings, Email, Left out of the index
    holds:
      - the folders inside an email folder that only the email index skips, with an add field
    links:
      - to: settings.folder-menu
        via: a row's kebab

  - id: settings.budget
    area: settings
    title: Mail downloads per run
    root: data-surface
    reach:
      - Settings, Email, Mail downloads
    holds:
      - Download limit, No limit, None (local only), 512 MB, 2 GB or 5 GB
      - a note on what a run does at the limit

  - id: settings.outlook
    area: settings
    title: Outlook archiving
    root: data-surface
    reach:
      - Settings, Outlook archive, Outlook archiving
    holds:
      - an Outlook category switch and its note
      - an Also archive in Outlook switch and its note
      - a closing note

  - id: settings.markdown-search
    area: settings
    title: Documents search
    root: data-surface
    reach:
      - Settings, Files and documents, Documents search
    holds:
      - a Documents search switch and its note

  - id: settings.remote-html
    area: settings
    title: Block remote content in HTML
    root: data-surface
    reach:
      - Settings, Files and documents, Remote content
    holds:
      - a Block remote content switch and its note

  - id: settings.explorer-window
    area: settings
    title: Reuse an open Explorer window
    root: data-surface
    reach:
      - Settings, Files and documents, Explorer window
    holds:
      - a Reuse an open window switch and its note

  - id: settings.md-assoc
    area: settings
    title: Associate Markdown files with this app
    root: data-surface
    reach:
      - Settings, Files and documents, Markdown files (the PC only)
    holds:
      - an Open with this app switch and a note saying what the registry holds
    states:
      - the row is hidden off the PC
      - the switch is disabled when the state cannot be read, and the note says so

  - id: settings.tray-click
    area: settings
    title: Tray click opens Quick search
    root: data-surface
    reach:
      - Settings, Tray and screenshot, Tray click
    holds:
      - an Opens Quick search switch and its note

  - id: settings.screenshot
    area: settings
    title: Screenshot
    root: data-surface
    reach:
      - Settings, Tray and screenshot, Screenshot (Screenshot block on)
    holds:
      - Hold to capture, Copy to clipboard and Show loupe switches
      - JPEG quality, File prefix and Hotkey
      - Save folder, with Open folder on the PC
      - a note under each
    does:
      - every setting applies from the next capture, except the hotkey, which applies when the tray next starts
      - the save folder is changed from the tray menu or config.json, never from this page

  - id: settings.remote
    area: settings
    title: Remote access
    root: data-surface
    reach:
      - Settings, Remote access
    holds:
      - a Remote access switch and a note on the address and sign-in it opens

  - id: settings.folder-menu
    area: settings
    title: Folder row menu
    root: data-surface
    reach:
      - the kebab on a row of any folder list
    holds:
      - Remove
    does:
      - Remove asks first
    links:
      - to: settings.folder-remove
        via: Remove

  - id: settings.folder-remove
    area: settings
    title: Remove this folder?
    root: data-surface
    reach:
      - Remove in a folder list's row menu
    holds:
      - the folder's path
      - "*Only the list changes: the folder and everything in it stay on disk.*"
      - Remove
    does:
      - × or a tap outside backs out and changes nothing

  - id: keys.search
    area: keys
    title: Search keys
    root:
      none: keyboard paths on the Search tab, with no element of their own; the keyboard sheet lists them
    reach:
      - the Search tab, with focus outside a field and no sheet open
    holds:
      - "/ goes to the search box; the down arrow moves from the box into the results"
      - "j and k move between results; Enter opens the preview sheet"
      - "a shows all of a mail; o opens it in Outlook (this PC); e opens the folder in File Explorer (this PC); f shows the folder in Explore; c copies the path"
      - Esc goes back to the search box
    states:
      - "Documents: e opens in the default app (this PC); Folders: e opens in File Explorer (this PC)"

  - id: keys.doc
    area: keys
    title: Document keys
    root:
      none: keyboard paths in the viewer and editor, with no element of their own
    reach:
      - the document sheet and window
    holds:
      - Esc in Edit goes back to View
      - Ctrl+S or Cmd+S saves the editor
    links:
      - to: doc.editor
        via: Edit

  - id: keys.double-click
    area: keys
    title: Open a row
    root:
      none: a gesture on Explore's contents rows, with no element of its own
    reach:
      - a double-click on a row (a mouse), a tap on a Markdown or HTML row (touch)
    holds:
      - a folder row opens in File Explorer and a file in its default app, on the PC only
      - a Markdown or HTML row opens in the document sheet on every device
    links:
      - to: doc.sheet
        via: a Markdown or HTML row

  - id: keys.drop-file
    area: keys
    title: Drop a file
    root:
      none: a gesture on the window; the overlay it shows is chrome.drop-overlay
    reach:
      - dragging a Markdown or HTML file onto the app window or the document window
    holds:
      - a file the scan has opens as an indexed document, with Edit
      - any other opens read-only from the text the page read, with a note saying why
      - anything else is refused with a toast
    links:
      - to: chrome.drop-overlay
        via: the drag
      - to: doc.window
        via: the drop
