# .fleet.toml -- this repo's card on the fleet architecture map. Keep it current:
# update it in the same PR as any material change (layer, port, role, one-line
# description, exposed services).
layer       = "working-web"
icon        = "🗂️"
port        = ":8453"
description = "Disk-space explorer with folder tree, largest files, file types, and folder and mail search."
depends_on  = ["project-scaffolding"]
shape       = "webapp-tray"
extra_roots = []

# The coupling scan reads tray.bat's REM example of a VERSION_URL override
# (127.0.0.1:8000, the hub's port); the app never calls the hub.
[contracts]
ignore_refs = [
  { path = "tray.bat", repo = "local-llm-hub", why = "REM example URL for the VERSION_URL override, not a call to the hub" },
]

# Explore is a tree with attribute columns and Search a list beside its preview,
# so both span the window on desktop.
[design]
wide_views = ["search", "explore"]

# /design-review's e2e capture (tests/e2e/_surface.py) flips light/dark in place on an open
# surface; this app stamps html[data-theme] at load from folder-explorer.theme (else the OS
# scheme), so the hook sets that key too or its dark shots stay light.
[design.review]
theme_storage_key = "folder-explorer.theme"

# `measure --e2e` and `--synthetic` walk this throwaway app (invented trees, a temp data
# folder), never the live tray on :8453 (scripts/design_review_synthetic.py). The timeout
# covers the fixture scan that runs before the app starts.
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 60

# The capture run is the whole suite on both projections; --e2e-autoboot lets it boot its own
# instance while the live app holds :8453, and never opts in to acting on the live one.
[design.review.e2e]
command   = ["-m", "pytest", "tests/e2e", "-q", "--e2e-autoboot"]
timeout_s = 1500

# Search and Largest show the owner's own mail text and folder names, which can hold
# snake_case words (a tracking parameter in a link, a folder someone named that way):
# the app reports them as they are, so renaming them would misreport the disk.
[[design.accepted]]
rule   = "COMP-11"
reason = "The snake_case text is the owner's own mail snippets and folder names, shown verbatim; the app's own copy carries no raw identifier"

# The Settings sheet has no commit: each folder list saves as soon as a path is added,
# and the Add button beside its path field is the labelled utility button at that
# field's height. The review reads any submit button as the view's primary action and
# the dialog's commit, so it measures Add against button-primary and against the
# larger "Show macro" button, which does not describe this sheet.
[[design.accepted]]
rule   = "TOUCH-03"
reason = "Add beside a folder path field is a utility button at the field's height; the Settings sheet has no primary action, and a 48px button would stand taller than its 36px field"

[[design.accepted]]
rule   = "COMP-16"
reason = "The Settings sheet has no footer commit: Add saves a folder as it is added, and it stays the same height as the field beside it, so the larger Show macro button is not a rival to a commit"

# The contract failures below have their only evidence in docs/design/unified-app-mockup.html,
# a self-contained reference page read in a browser and never served; the shipped page mounts one
# footer outside the tab panels and its modals are the vendored modal shell.
[[design.accepted]]
check  = "modal-unstyled-rows"
target = "docs/design/unified-app-mockup.html"
detail = "1 dialog row class(es) with no dialog-scoped styling (design.md modal contract): docs/design/unified-app-mockup.html:2869 label.tb-field (never styled)"
reason = "Evidence is the design mock-up under docs/design, which is never served; the shipped modals are the vendored modal shell"

[[design.accepted]]
check  = "page-foot"
target = "docs/design/unified-app-mockup.html"
detail = "3 page-foot elements — mount one footer, outside the tab panels"
reason = "Evidence is the design mock-up under docs/design, which is never served; the shipped page mounts one footer outside the tab panels"

# Whether a scan or an email run is running, finished, failed or died: one derive function over the
# run row and its lock (docs/run-state.md). tests/test_run_state.py carries the transition proof.
[[state_machines]]
name   = "run-state"
module = "src/run_state.py"
type   = "RunState"
derive = "derive_run_state"

# The Search preview's "Show all" load of one mail: idle, loading, ok or error, one step function
# that refuses an illegal move (docs/body-state.md). tests/js/body_state.test.mjs carries the proof.
[[state_machines]]
name   = "body-state"
module = "app/webapp/static/body-state.js"
type   = "BodyState"

