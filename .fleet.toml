# .fleet.toml -- this repo's card on the fleet architecture map. Keep it current:
# update it in the same PR as any material change (layer, port, role, one-line
# description, exposed services).
layer       = "working-web"
icon        = "🗂️"
port        = ":8453"
description = "Disk-space explorer and search: folder tree, largest files, file types, folder and mail search."
depends_on  = ["project-scaffolding"]
shape       = "webapp-tray"
extra_roots = []

# The coupling scan reads tray.bat's REM example of a VERSION_URL override
# (127.0.0.1:8000, the hub's port); the app never calls the hub.
[contracts]
ignore_refs = [
  { path = "tray.bat", repo = "local-llm-hub", why = "REM example URL for the VERSION_URL override, not a call to the hub" },
]

# Explore is a tree with attribute columns and Search a list beside its preview,
# so both span the window on desktop.
[design]
wide_views = ["search", "explore"]

# Search and Largest show the owner's own mail text and folder names, which can hold
# snake_case words (a tracking parameter in a link, a folder someone named that way):
# the app reports them as they are, so renaming them would misreport the disk.
[[design.accepted]]
rule   = "COMP-11"
reason = "The snake_case text is the owner's own mail snippets and folder names, shown verbatim; the app's own copy carries no raw identifier"

# The Settings sheet has no commit: each folder list saves as soon as a path is added,
# and the Add button beside its path field is the labelled utility button at that
# field's height. The review reads any submit button as the view's primary action and
# the dialog's commit, so it measures Add against button-primary and against the
# larger "Show macro" button, which does not describe this sheet.
[[design.accepted]]
rule   = "TOUCH-03"
reason = "Add beside a folder path field is a utility button at the field's height; the Settings sheet has no primary action, and a 48px button would stand taller than its 36px field"

[[design.accepted]]
rule   = "COMP-16"
reason = "The Settings sheet has no footer commit: Add saves a folder as it is added, and it stays the same height as the field beside it, so the larger Show macro button is not a rival to a commit"

