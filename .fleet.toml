# .fleet.toml -- this repo's card on the fleet architecture map. Keep it current:
# update it in the same PR as any material change (layer, port, role, one-line
# description, exposed services).
layer       = "working-web"
icon        = "🗂️"
port        = ":8453"
description = "Disk-space explorer and search: folder tree, largest files, file types, folder and email-archive search, and the headless Outlook archive verbs."
depends_on  = ["project-scaffolding"]
shape       = "webapp-tray"
extra_roots = []

# Explore is a tree with attribute columns and Search a list beside its preview,
# so both span the window on desktop.
[design]
wide_views = ["search", "explore"]

