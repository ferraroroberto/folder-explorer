<title>Document · Folder explorer</title>
<script>
  (function () {
    var app = 'folder-explorer';
    var root = document.documentElement;
    var theme = null;
    var size = null;
    try {
      theme = localStorage.getItem(app + '.theme');
      size = localStorage.getItem(app + '.textsize');
    } catch (e) {}
    var dark = theme ? theme === 'dark'
      : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'dark' : 'light';
    root.dataset.textsize = size === 'small' || size === 'large' ? size : 'default';
  })();
</script>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button id="tabSearch" type="button" class="tab" data-tab="search" role="tab" aria-selected="false" data-track="doc-tab-search">

  </button>
  <button id="tabExplore" type="button" class="tab" data-tab="explore" role="tab" aria-selected="false" tabindex="-1" data-track="doc-tab-explore">

  </button>

<main class="app doc-app">
  <div class="card home-head">
    <span class="home-title">
      <svg class="icon" aria-hidden="true"><use href="#i-file-text"></use></svg>
      <span id="docTitle">Document</span>
    </span>
    <span class="status head-status" id="docStatus" role="status" aria-live="polite"></span>
    <button type="button" class="icon-button home-toggle doc-outline-toggle" id="docOutlineBtn" aria-label="Outline" title="Outline" aria-expanded="false" aria-controls="docOutline" data-track="doc-page-outline" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-list"></use></svg>
    </button>
    <button type="button" class="button-primary doc-save" id="docSave" data-track="doc-page-save" disabled hidden>Save</button>
    <button type="button" class="icon-button home-toggle theme-toggle" aria-label="Switch to dark theme" title="Switch to dark theme" data-track="doc-theme-toggle">
      <svg class="icon" aria-hidden="true"><use href="#i-moon"></use></svg>
    </button>
  </div>
  <div class="doc-modebar">
    <div class="segmented doc-mode" role="group" aria-label="Mode">
      <button type="button" class="segmented-item" aria-pressed="true" data-mode="view" data-track="doc-page-mode-view">View</button>
      <button type="button" class="segmented-item" aria-pressed="false" data-mode="edit" data-track="doc-page-mode-edit">Edit</button>
    </div>
  </div>
  <div class="doc-layout">
    <aside class="card doc-side" id="docOutline" aria-label="Outline and recent documents" hidden></aside>
    <div class="card doc-main" id="docBody"><p class="doc-loading" role="status">Loading…</p></div>
  </div>
</main>

<script type="module" src="/static/doc-page.js"></script>
