    area: scans
    title: What the email stage reads
    root: data-surface
    reach:
      - the help button on the Email index card
    holds:
      - which files the stage reads, that an online-only file is downloaded, that files are opened read-only and that a failed file is not read again until it changes

  - id: scans.failures
    area: scans
    title: Failed reads
    root: data-surface
    reach:
      - the Failed reads cell of the Email index card
    holds:
      - the newest failed files with each reason, and how many there are in all
    states:
