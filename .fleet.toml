# [structure_ratchet] -- scripts/structure_ratchet.py fails when a file passes 1,000
# lines, a function 100 lines or a directory 40 modules, when src/ imports app/, and
# when the root folders do not match `shape` plus `extra_roots`. Exit 3 fails the gate.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"
# docs/design holds self-contained reference pages (the search study and the
# app mock-up, vendored CSS inlined), read in a browser, never run as code.
exclude  = ["docs/design/**"]

# [instruction_ratchet] -- the prompt-audit lint rules and size caps over CLAUDE.md,
# AGENTS.md and any skill. Exit 3 fails the gate.
[instruction_ratchet]
enabled             = true
baseline            = ".instruction-ratchet-baseline.json"
ci_expectations     = true
agents_pointer      = true
claude_md_max_lines = 120
repeated_text_words = 12

# [doc_refs_ratchet] -- README.md, CLAUDE.md and docs/ naming a path, module, link or
# loopback port that does not exist. The app's own port comes from `port` above;
# 8445 is app-launcher, whose jobs API registers the nightly scan.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
allow_refs = ["8445"]

# [dead_code_ratchet] -- a Python function, class or method nothing names. Route
# handlers, tests and [vendored] files are never reported. Exit 3 fails the gate.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [static_ratchet] -- duplicated blocks (jscpd), unused imports and variables and
# likely-bug/security patterns (ruff). Needs Node (npx) and ruff. [vendored] files
# are left out automatically. Exit 3 (a detector could not run) fails the gate.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**", "docs/design/**"]

# [docs_ratchet] -- the root README.md size budget and history markers (issue
# references, dated or changelog headings) in README.md and docs/.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"

# [comment_ratchet] -- issue references in product-code comments: a comment says why
# the code is the way it is now; history lives in the issue and git log.
[comment_ratchet]
enabled         = true
baseline        = ".comment-ratchet-baseline.json"
docstrings      = true
history_phrases = true

# [conventions_ratchet] -- fleet conventions as stdlib `ast` rules: every spawn
# passes creationflags, app/ and src/ log instead of printing, no hardcoded drive
# path, secrets are compared only in src/secret_compare.py, git runs only through
# the vendored build identity, and the one password field is the vendored sign-in sheet, and the password route is held to the vendored login lock-out.
[conventions_ratchet]
enabled        = true
baseline       = ".conventions-ratchet-baseline.json"
rules          = ["no-window", "logging-not-print", "no-drive-path", "secret-compare", "git-wrapper", "password-input-vendored", "login-lockout", "state-literal", "state-set-repeat", "state-write"]
secret_helpers = ["src/secret_compare.py"]
git_wrappers   = ["src/build_info.py"]

# The scan history (store.py) opens its own file with its own pragmas; every other
# SQLite file (the email index, the scan indexes) opens through src/runtime_files.py,
# which refuses a path under a code folder, and its stores set their pragmas after.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/runtime_files.py", "src/store.py"]
why    = "src/runtime_files.py refuses a path under a code folder; store.py sets the history's pragmas"

# A bare requests call skips the pooled, keep-alive session; the app's only outbound
# calls are the tray's loopback probes, which go through src/pooled_http.py.
[[conventions_ratchet.must_use]]
call   = ["requests.get", "requests.post", "requests.put", "requests.patch", "requests.delete", "requests.head", "requests.request"]
helper = ["src/pooled_http.py"]
why    = "src/pooled_http.py is the one pooled session (sized keep-alive adapter, connect-timeout handling)"
paths  = ["app/", "src/"]

# A raw replace skips the unique temp name and the cleanup on a failed write.
[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["src/atomic_write.py"]
why    = "src/atomic_write.py is the one atomic file writer (unique temp, cleanup on failure)"

# [runtime_write_ratchet] -- a write target resolving under a code folder (runtime
# output goes to the runtime-data folder); --snapshot/--probe bracket the tests.
# store.data_dir/index_dir/state_path resolve under the runtime-data root, outside the tree.
[runtime_write_ratchet]
enabled    = true
baseline   = ".runtime-write-ratchet-baseline.json"
safe_calls = ["data_dir", "index_dir", "state_path", "runtime_data_dir"]

# [usage_track_ratchet] -- every web control carries a constant data-track id and
# every <dialog> a data-track-view; usage-log-wired holds the app to its usage log.
[usage_track_ratchet]
enabled  = true
baseline = ".usage-track-ratchet-baseline.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired"]
